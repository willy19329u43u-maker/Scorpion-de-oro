<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Iniciar Sesión | Escorpión de Oro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <img src="logo.png" alt="Logo Escorpión de Oro" class="login-logo" onerror="this.style.display='none'"/>
        <h1>Escorpión de Oro</h1>
        <p>Acceso al área privada del club</p>
      </div>

      <form id="formLogin">
        <div class="form-group">
          <label>Correo electrónico</label>
          <input type="email" id="loginEmail" placeholder="coach@escorpionoro.com" required />
        </div>
        <div class="form-group">
          <label>Contraseña</label>
          <input type="password" id="loginPassword" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn-login btn-guardar">Iniciar Sesión</button>
      </form>

      <div class="login-info">
        <h3>Cuentas de prueba:</h3>
        <ul>
          <li><strong>Coach:</strong> coach@escorpionoro.com / coach123</li>
          <li><strong>Miembro:</strong> jugador1@escorpionoro.com / miembro123</li>
        </ul>
        <p><small>Los datos se guardan localmente en tu navegador (IndexedDB).</small></p>
      </div>
    </div>
  </div>

  <script src="js/db.js"></script>
  <script>
    document.getElementById('formLogin').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;

      const usuario = await window.escDb.getUser(email);
      if (!usuario || usuario.password !== password) {
        alert('Credenciales incorrectas. Intenta con una cuenta de prueba.');
        return;
      }

      await window.escDb.setSession(usuario);

      if (usuario.rol === 'coach') {
        window.location.href = 'index.html';
      } else {
        window.location.href = 'index.html';
      }
    });

    /* Inicializar usuarios por defecto si no existen */
    window.escDb.initDefaultUsers();
  </script>
</body>
</html>
